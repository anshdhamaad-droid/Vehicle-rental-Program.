<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Booking</title>
     <link rel="stylesheet" href="Style.css">
</head>
<body>
    <section  class="booking-form">
        <h2>Book Your Vehicle</h2>

        <form action="Vehicles.html" method="get">
            <label for="location">Pickup Location</label>
            <input type="text" id="location" name="location" placeholder="Enter Your City" required>

            <br><br>

            <label for="pickup">Pickup Date:</label>
            <input type="date" id="pickup" name="pickup" required>

            <br><br>

            <label for="dropoff">Drop-off Date:</label>
            <input type="date" id="dropoff" name="dropoff" required>

            <button type="submit">Search Vehicles</button>

        </form>


    </section>
    
</body>
</html>
